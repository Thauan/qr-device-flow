name: Release

# Push to main:
#   - pending changesets        -> "version" opens or updates the version PR (nothing is published)
#   - no changesets, versions changed in this push (the version PR was merged) -> "publish"
#   - otherwise                 -> nothing runs
# Manual (workflow_dispatch): publishes what isn't on npm yet, when no changesets are pending.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for pending changesets
        id: pending
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "pending changesets: $count"

      - name: Setup pnpm
        if: steps.pending.outputs.count != '0'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.pending.outputs.count != '0'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.pending.outputs.count != '0'
        run: pnpm install --frozen-lockfile

      # Opens or updates the "version packages" PR. Without a publish step, nothing is published here.
      - name: Open or update the version PR
        if: steps.pending.outputs.count != '0'
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # HEAD and its parent, to compare versions

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Decide whether to publish
        id: gate
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          if [ "$pending" != "0" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "changesets are pending: nothing to publish yet"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On push: publish only when a package version changed in this push.
          changed=false
          for file in packages/*/package.json; do
            new=$(node -p "require('./$file').version")
            old=$(git show "HEAD~1:$file" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" || echo "")
            if [ "$new" != "$old" ]; then
              echo "version changed: $file ($old -> $new)"
              changed=true
            fi
          done
          echo "publish=$changed" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.gate.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      # Builds and publishes the versions that aren't on npm yet (changeset publish).
      - name: Publish
        if: steps.gate.outputs.publish == 'true'
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
