name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Build, typecheck and unit tests for every workspace.
  ci:
    runs-on: ubuntu-latest

    services:
      # Lets the storage-redis integration tests run against real Redis.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm exec turbo run build

      - name: Type check
        run: pnpm exec turbo run typecheck

      - name: Run unit tests
        run: pnpm exec turbo run test

      # Every PR that changes a published package needs a changeset.
      - name: Check changesets
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/main

  # End-to-end tests against the Docker Compose stack: Redis, the API (verification on
  # and off) and the Next.js app. The images are built from the Dockerfile with buildx
  # and cached in GitHub Actions; Playwright runs on the runner against the published ports.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images (cached)
        uses: docker/bake-action@v6
        with:
          files: examples/express-vanilla/docker-compose.yml
          # The build context is the repository root, outside the compose file's folder.
          allow: fs.read=${{ github.workspace }}
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Start the stack
        working-directory: examples/express-vanilla
        run: docker compose -f docker-compose.yml up -d --no-build --wait

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile --filter qr-device-flow-example

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        working-directory: examples/express-vanilla
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: examples/express-vanilla
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_NEXT_URL: http://localhost:3200
          E2E_NONE_URL: http://localhost:3001
          CI: "1"
        run: pnpm run test:e2e

      - name: Save service logs
        if: failure()
        working-directory: examples/express-vanilla
        run: docker compose -f docker-compose.yml logs --no-color > compose-logs.txt

      - name: Upload Playwright report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            examples/express-vanilla/playwright-report
            examples/express-vanilla/test-results
            examples/express-vanilla/compose-logs.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down
        if: always()
        working-directory: examples/express-vanilla
        run: docker compose -f docker-compose.yml down -v --remove-orphans
