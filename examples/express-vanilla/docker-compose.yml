# Full stack: Redis + the demo server (service "server"), plus an optional Playwright run.
#
#   docker compose up --build              # API + login pages on http://localhost:3000, Next.js on :3200
#   docker compose --profile e2e run --rm e2e   # run the e2e suite against it
#   docker compose down -v

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Not named "app": the .app TLD is HSTS-preloaded, so Chrome would turn
  # http://app:3000 into https:// and fail.
  server:
    build:
      context: ../..
      dockerfile: examples/express-vanilla/Dockerfile
      target: app
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      # Used in the QR code. Must be reachable from the phone (or the browser
      # that stands in for it).
      PUBLIC_URL: "http://localhost:3000"
      REDIS_URL: "redis://redis:6379"
      # Short TTL so the e2e expiry test is quick. Library default is 120.
      TTL_SECONDS: "30"
      # The Next.js app sits in front of this server (see the web service).
      TRUST_PROXY: "1"
      # Plain HTTP between the containers: a Secure cookie would be dropped.
      COOKIE_SECURE: "false"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  # A second API instance with verification off, for the verification-none e2e spec.
  server-none:
    build:
      context: ../..
      dockerfile: examples/express-vanilla/Dockerfile
      target: app
    environment:
      PORT: "3000"
      PUBLIC_URL: "http://localhost:3001"
      REDIS_URL: "redis://redis:6379"
      TTL_SECONDS: "30"
      TRUST_PROXY: "1"
      COOKIE_SECURE: "false"
      VERIFICATION: "none"
    ports:
      - "3001:3000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  # The Next.js app. It reaches the API through its own /device proxy.
  web:
    build:
      context: ../..
      dockerfile: examples/express-vanilla/Dockerfile
      target: next
    ports:
      - "3200:3200"
    environment:
      # Read at runtime by app/device/[...path]/route.ts.
      API_URL: "http://server:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/"]
      interval: 3s
      timeout: 3s
      retries: 30

  e2e:
    profiles: ["e2e"]
    build:
      context: ../..
      dockerfile: examples/express-vanilla/Dockerfile
      target: e2e
    environment:
      E2E_BASE_URL: "http://server:3000"
      E2E_NEXT_URL: "http://web:3200"
      E2E_NONE_URL: "http://server-none:3000"
      CI: "1"
    depends_on:
      server:
        condition: service_healthy
      server-none:
        condition: service_healthy
      web:
        condition: service_healthy
    ipc: host
