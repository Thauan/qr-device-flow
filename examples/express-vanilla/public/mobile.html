<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Device Flow — Mobile app (demo)</title>
  <style>
    :root {
      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #1a1b23;
      --muted: #5f6370;
      --accent: #2563eb;
      --danger: #b91c1c;
      --ok: #15803d;
      --border: #d7dae3;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1117;
        --card: #181b24;
        --text: #e7e9ef;
        --muted: #9aa0ad;
        --accent: #60a5fa;
        --danger: #f87171;
        --ok: #4ade80;
        --border: #2d3140;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f1117;
      --card: #181b24;
      --text: #e7e9ef;
      --muted: #9aa0ad;
      --accent: #60a5fa;
      --danger: #f87171;
      --ok: #4ade80;
      --border: #2d3140;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }
    h1 { font-size: 1.1rem; margin: 0 0 16px; text-align: center; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    input {
      width: 100%;
      font: inherit;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      margin-bottom: 14px;
    }
    .code {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 1.2rem;
      letter-spacing: 0.12em;
      text-align: center;
      margin: 4px 0 16px;
    }
    .consent dl { margin: 0 0 16px; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 0.85rem; }
    .consent dt { color: var(--muted); }
    .consent dd { margin: 0; word-break: break-word; }
    .warning { font-size: 0.8rem; color: var(--muted); margin-bottom: 14px; }
    .actions { display: flex; gap: 10px; }
    button {
      flex: 1;
      font: inherit;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--danger); border: 1px solid var(--border); }
    button:disabled { opacity: 0.5; cursor: default; }
    .feedback { margin-top: 16px; padding: 12px; border-radius: 10px; text-align: center; font-size: 0.9rem; }
    .feedback-success { color: var(--ok); }
    .feedback-denied { color: var(--muted); }
    .feedback-error { color: var(--danger); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Approve sign-in</h1>

    <p id="no-code" class="warning" hidden>No login request. Open this page from the QR code on the website.</p>

    <label for="user-id">Signed-in user (demo)</label>
    <input id="user-id" data-testid="user-id" type="text" autocomplete="off" placeholder="e.g. alice" />

    <div id="flow">
      <label>Login code</label>
      <p id="user-code" data-testid="user-code" class="code">—</p>

      <div id="review">
        <button id="review-btn" data-testid="review-btn" type="button">Review request</button>
      </div>

      <div id="consent" class="consent" data-testid="consent" hidden>
        <p class="warning">Only approve if you are signing in to this browser.</p>
        <dl>
          <dt>Browser</dt><dd id="requester-agent" data-testid="requester-agent">—</dd>
          <dt>IP</dt><dd id="requester-ip" data-testid="requester-ip">—</dd>
          <dt>Location</dt><dd id="requester-location" data-testid="requester-location">—</dd>
          <dt>Expires in</dt><dd id="expires-in" data-testid="expires-in">—</dd>
        </dl>
        <div id="number-field">
          <label for="number-input">Number shown on the login screen</label>
          <input id="number-input" data-testid="number-input" inputmode="numeric" maxlength="2"
            autocomplete="off" placeholder="00" />
        </div>
        <div class="actions">
          <button id="deny-btn" class="secondary" data-testid="deny-btn" type="button">Deny</button>
          <button id="approve-btn" data-testid="approve-btn" type="button">Approve</button>
        </div>
      </div>
    </div>

    <p id="feedback" data-testid="feedback" class="feedback" role="status" hidden></p>
  </main>

  <script src="/mobile-app.js"></script>
</body>
</html>
