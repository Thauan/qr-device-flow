<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
  <title>QR Device Flow — Web login</title>
  <style>
/* Visual style adapted from the CodePen "Phone Verification with OTP" by Abdelrhman Said
   (MIT License), https://codepen.io/abdelrhmansaid/pen/JjJpxXb — see THIRD_PARTY_NOTICES.md */
  :root {
    --bg: #EAF5F6;
    --card: #ffffff;
    --text: #093030;
    --muted: #6b8080;
    --subtle: #B5BAB8;
    --accent: #3DAFE1;
    --ok: #15803d;
    --warn: #b45309;
    --err: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1d1e; --card: #122a2b; --text: #EAF5F6; --muted: #9fb5b5; --subtle: #56706f;
      --accent: #3DAFE1; --ok: #4ade80; --warn: #fbbf24; --err: #fb923c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1d1e; --card: #122a2b; --text: #EAF5F6; --muted: #9fb5b5; --subtle: #56706f;
    --accent: #3DAFE1; --ok: #4ade80; --warn: #fbbf24; --err: #fb923c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', system-ui, sans-serif; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background-color: var(--bg); color: var(--text);
  }
  [hidden] { display: none !important; }
  main {
    width: 100%; max-width: 400px; padding: 40px 32px; text-align: center;
    background-color: var(--card); border-radius: 25px;
  }
  @media (min-width: 480px) { main { padding: 50px; } }
  h1 { font-size: 28px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .sub, .warning { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; text-align: left; }
  input {
    width: 100%; padding: 12px 14px; margin-bottom: 16px; font-size: 14px;
    border: none; border-radius: 5px; background-color: var(--bg); color: var(--text);
  }
  input:focus { outline: none; box-shadow: 0 0 0 2px var(--accent); }
  button {
    font-weight: 600; cursor: pointer; border: none; border-radius: 10px;
    padding: 12px 18px; color: #ffffff; background-color: var(--accent);
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: transparent; color: var(--err); box-shadow: inset 0 0 0 1px var(--subtle); }
  footer { margin-top: 24px; font-size: 12px; color: var(--subtle); }
  footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
  #qr { display: block; width: 220px; height: 220px; margin: 0 auto 16px; }
  #user-code { font-family: ui-monospace, Menlo, monospace; font-size: 18px; letter-spacing: 0.15em; margin-bottom: 14px; }
  /* The verification number reads like the OTP boxes in the original design. */
  #verification-number { font-size: 14px; color: var(--muted); margin-bottom: 18px; }
  #verification-number strong {
    display: inline-block; margin-left: 6px; padding: 6px 14px; border-radius: 5px;
    font-size: 28px; letter-spacing: 0.4em; color: var(--text); background-color: var(--bg);
  }
  #status { font-size: 14px; min-height: 1.5em; margin-bottom: 12px; color: var(--muted); }
  #status[data-state="scanned"] { color: var(--warn); }
  #status[data-state="approved"], #status[data-state="logged-in"] { color: var(--ok); }
  #status[data-state="denied"], #status[data-state="expired"], #status[data-state="approved-consumed"] { color: var(--err); }
  #error { color: var(--err); font-size: 13px; margin-bottom: 12px; }
  button#retry { background: transparent; color: var(--accent); }
  pre#session {
    text-align: left; font-size: 12px; overflow-x: auto; margin-top: 14px; padding: 12px;
    border-radius: 10px; background-color: var(--bg);
  }
  footer span { color: var(--text); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Sign in with your phone</h1>
    <p class="sub">Scan the code with your logged-in app.</p>

    <img id="qr" data-testid="qr" alt="Login QR code" hidden />
    <p id="user-code" data-testid="user-code" hidden></p>
    <p id="verification-number" data-testid="verification-number" hidden>
      Confirm on your phone: <strong data-testid="verification-number-value"></strong>
    </p>

    <p id="status" data-testid="status" data-state="loading">Loading…</p>
    <p id="error" data-testid="error" role="alert" hidden></p>

    <button id="retry" data-testid="retry" type="button" hidden>Try again</button>
    <pre id="session" data-testid="session" hidden></pre>

    <footer>Transport: <span id="transport" data-testid="transport">…</span> ·
      <a href="?transport=sse">SSE</a> · <a href="?transport=polling">polling</a>
    </footer>
  </main>

  <script src="/app.js"></script>
</body>
</html>
