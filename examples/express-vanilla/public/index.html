<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Device Flow — Web login</title>
  <style>
    :root {
      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #1a1b23;
      --muted: #5f6370;
      --accent: #2563eb;
      --ok: #15803d;
      --warn: #b45309;
      --err: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1117;
        --card: #181b24;
        --text: #e7e9ef;
        --muted: #9aa0ad;
        --accent: #60a5fa;
        --ok: #4ade80;
        --warn: #fbbf24;
        --err: #f87171;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f1117;
      --card: #181b24;
      --text: #e7e9ef;
      --muted: #9aa0ad;
      --accent: #60a5fa;
      --ok: #4ade80;
      --warn: #fbbf24;
      --err: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }
    h1 { font-size: 1.15rem; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 20px; }
    #qr {
      width: 220px;
      height: 220px;
      margin: 0 auto 16px;
      display: block;
    }
    #user-code {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      margin: 0 0 16px;
    }
    #status { min-height: 1.5em; font-size: 0.95rem; margin-bottom: 12px; }
    #status[data-state="approved"], #status[data-state="logged-in"] { color: var(--ok); }
    #status[data-state="scanned"] { color: var(--warn); }
    #status[data-state="denied"], #status[data-state="expired"], #status[data-state="approved-consumed"] { color: var(--err); }
    #error {
      color: var(--err);
      font-size: 0.85rem;
      margin-bottom: 12px;
    }
    button {
      font: inherit;
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    [hidden] { display: none !important; }
    pre {
      text-align: left;
      background: var(--bg);
      padding: 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      overflow-x: auto;
      margin: 12px 0 0;
    }
    footer { margin-top: 20px; font-size: 0.75rem; color: var(--muted); }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Sign in with your phone</h1>
    <p class="sub">Scan the code with your logged-in app.</p>

    <img id="qr" data-testid="qr" alt="Login QR code" hidden />
    <p id="user-code" data-testid="user-code" hidden></p>

    <p id="status" data-testid="status" data-state="loading">Loading…</p>
    <p id="error" data-testid="error" role="alert" hidden></p>

    <button id="retry" data-testid="retry" type="button" hidden>Try again</button>
    <pre id="session" data-testid="session" hidden></pre>

    <footer>Transport: <span id="transport" data-testid="transport">…</span> ·
      <a href="?transport=sse">SSE</a> · <a href="?transport=polling">polling</a>
    </footer>
  </main>

  <script src="/app.js"></script>
</body>
</html>
